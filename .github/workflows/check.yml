name: Checks
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --manifest-path host/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path host/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path host/Cargo.toml
      - run: node --test tests/extension.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo build --release --locked --manifest-path host/Cargo.toml
      - run: python3 tests/smoke-package.py
      - run: python3 tests/smoke-install.py
      - run: dbus-run-session -- python3 tests/smoke-host.py host/target/release/mpris-hyprland-host
